name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Safe C++ + Rust + Python / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: python scripts/build.py
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=msal --cov-report=term-missing:skip-covered
      - run: python scripts/code_map.py --check
      - run: python scripts/file_guide.py --check
      - run: python scripts/validate_repo.py
  native-assurance:
    name: Sanitizer proofs + coverage-guided fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-18 clang-format-18 llvm-18 libclang-rt-18-dev
      - run: clang-format-18 --dry-run --Werror native/*.cpp native/*.hpp specimens/*.cpp
      - run: python scripts/sanitizers.py --run-trusted-specimens
      - run: python scripts/fuzz.py
  benchmark:
    name: Release correctness + performance observations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: python scripts/build.py
      - run: python scripts/benchmark.py
  security:
    name: Locked graph + secret + workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
      - run: python scripts/scanners.py gitleaks
      - run: python scripts/scanners.py actionlint
      - run: .tools/gitleaks git . --redact --no-banner
      - run: .tools/actionlint
