# Jason Stys: dependency-free safe Rust equivalents; no unsafe code or external crates.
[package]
name = "memory-safety-analysis-lab"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jason Stys"]
license = "MIT"
[lib]
path = "rust/lib.rs"
[[bin]]
name = "parser-rust"
path = "rust/main.rs"
[profile.release]
overflow-checks = true
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
